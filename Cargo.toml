[package]
name = "keynote"
version = "0.1.0"
edition = "2021"
description = "Markdown-powered slides / keynote-style presentation binary"
license = "MIT"

[[bin]]
name = "keynote"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
crossterm = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
