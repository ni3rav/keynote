<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
:root {
  --bg: #1a1b26;
  --bg-dark: #13141c;
  --bg-light: #24283b;
  --fg: #a9b1d6;
  --fg-bright: #c0caf5;
  --muted: #565f89;
  --accent: #7aa2f7;
  --line: #292e42;
  --selection: #292e42;
  --side: 232px;
  --split: 46%;
  --edit-h: 168px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", system-ui, sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 12px;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.brand { font-weight: 600; color: var(--fg-bright); letter-spacing: .01em; margin-right: 8px; }
.modes { display: flex; height: 100%; }
.modes button, #save, #format button {
  background: transparent;
  color: var(--muted);
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 0 12px;
  height: 100%;
  cursor: pointer;
  font: inherit;
}
.modes button.active { color: var(--fg-bright); border-bottom-color: var(--accent); }
#save {
  margin-left: auto;
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  border-bottom: 1px solid var(--line);
  color: var(--fg-bright);
}
#save:hover, #format button:hover, .modes button:hover, #slide-tools button:hover, .media-row button:hover { color: var(--fg-bright); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#status { min-width: 72px; text-align: right; color: var(--muted); font-size: 13px; }
#format {
  display: flex;
  gap: 2px;
  align-items: center;
  height: 36px;
  padding: 0 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  flex: none;
}
#format button { height: 28px; padding: 0 10px; border-radius: 6px; }
#format button:hover { background: var(--bg-light); }
#workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: var(--side) 6px minmax(0, 1fr);
}
#rail {
  background: var(--bg-dark);
  overflow: auto;
  min-height: 0;
}
#slide-tools { display: flex; gap: 6px; padding: 0 10px 8px; }
#slide-tools button, .media-row button {
  height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; font: inherit;
}
#inspector {
  display: none; background: var(--bg-dark); border-left: 1px solid var(--line);
  overflow: auto; padding: 12px 14px 20px; min-height: 0;
}
#inspector h2 { margin: 12px 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#inspector label { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
#inspector select, #inspector input {
  background: var(--bg); color: var(--fg-bright); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit;
}
#notes { width: 100%; min-height: 140px; box-sizing: border-box; }
.media-row { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
#rail h2 {
  margin: 0;
  padding: 12px 14px 6px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.slide-row, .card {
  cursor: grab;
}
.slide-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  border-left: 2px solid transparent;
  color: var(--fg);
}
.slide-row .n { color: var(--muted); width: 1.4em; font-variant-numeric: tabular-nums; }
.slide-row.current { background: var(--selection); border-left-color: var(--accent); color: var(--fg-bright); }
.slide-row.drop-target, .card.drop-target { outline: 1px solid var(--accent); }
.slide-row.dragging, .card.dragging { opacity: .45; pointer-events: none; }
.grip { color: var(--muted); font-size: 12px; letter-spacing: -1px; }
#divider-side, #v-divider, #h-divider {
  background: var(--line);
  cursor: col-resize;
  position: relative;
}
#h-divider { cursor: row-resize; }
#divider-side:hover, #v-divider:hover, #h-divider:hover,
#divider-side.dragging, #v-divider.dragging, #h-divider.dragging { background: var(--accent); }
#main { min-width: 0; min-height: 0; display: grid; }
textarea {
  margin: 0;
  border: 0;
  resize: none;
  background: var(--bg-dark);
  color: var(--fg-bright);
  font: 14px/1.5 "JetBrains Mono", ui-monospace, monospace;
  padding: 16px 18px;
  min-width: 0;
  min-height: 0;
}
textarea:focus { outline: none; }
#preview { grid-area: preview; border: 0; width: 100%; height: 100%; background: #111; min-width: 0; min-height: 0; }
#h-divider { grid-area: hdiv; }
#slide-source { grid-area: slide; }
#source { grid-area: source; }
#v-divider { grid-area: vdiv; }
#overview { grid-area: overview; }
#overview {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  padding: 16px;
  overflow: auto;
  background: var(--bg);
}
.card {
  background: var(--bg-light);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.card .label { padding: 8px 10px; font-size: 13px; color: var(--fg); }
.thumb { aspect-ratio: 16/9; overflow: hidden; background: #111; position: relative; }
.thumb iframe {
  width: 1280px;
  height: 720px;
  border: 0;
  transform-origin: 0 0;
  pointer-events: none;
  position: absolute;
  top: 0; left: 0;
}
body.mode-visual #main {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) 6px var(--edit-h);
  grid-template-areas: "preview" "hdiv" "slide";
}
body.mode-visual #source, body.mode-visual #v-divider, body.mode-visual #overview { display: none; }
body.mode-markdown #format { display: none; }
body.mode-markdown #main {
  grid-template-columns: var(--split) 6px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "source vdiv preview";
}
body.mode-markdown #slide-source, body.mode-markdown #h-divider, body.mode-markdown #overview { display: none; }
body.mode-overview #format, body.mode-overview #rail, body.mode-overview #divider-side { display: none; }
body.mode-overview #workspace { grid-template-columns: minmax(0, 1fr); }
body.mode-overview #main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "overview";
}
body.mode-overview #overview { display: grid; }
body.mode-overview #preview, body.mode-overview #source, body.mode-overview #slide-source,
body.mode-overview #v-divider, body.mode-overview #h-divider { display: none; }
body.mode-visual #workspace, body.mode-presenter #workspace { grid-template-columns: var(--side) 6px minmax(0, 1fr) 280px; }
body.mode-visual #inspector, body.mode-presenter #inspector { display: block; }
body.mode-presenter #format, body.mode-presenter #rail, body.mode-presenter #divider-side,
body.mode-presenter #slide-source, body.mode-presenter #h-divider { display: none; }
body.mode-presenter #workspace { grid-template-columns: minmax(0, 1fr) 300px; }
body.mode-presenter #main { grid-template-areas: "preview"; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
body.mode-present #format, body.mode-present #rail, body.mode-present #divider-side { display: none; }
body.mode-present #workspace { grid-template-columns: minmax(0, 1fr); }
body.mode-present #main {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "preview";
}
body.mode-present #source, body.mode-present #slide-source,
body.mode-present #v-divider, body.mode-present #h-divider, body.mode-present #overview { display: none; }
#help { display: none; flex: 1; min-height: 0; background: var(--bg); }
body.mode-help #format, body.mode-help #workspace { display: none; }
body.mode-help #help { display: block; }
.help-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; min-height: 0; }
.help-nav { background: var(--bg-dark); border-right: 1px solid var(--line); overflow: auto; padding: 12px; }
#help-search { width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg-bright); font: inherit; }
.help-cat { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.help-nav button { display: block; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: 6px; padding: 7px 8px; cursor: pointer; font: inherit; }
.help-nav button[aria-current="true"] { background: var(--selection); color: var(--fg-bright); }
#start-tour { margin-top: 16px; width: 100%; border: 1px solid var(--accent); color: var(--fg-bright); background: transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; }
#help-doc { overflow: auto; padding: 28px 36px 48px; max-width: 860px; }
#help-doc h1 { margin: 0 0 8px; color: var(--fg-bright); font-size: 28px; }
#help-doc h2 { margin: 22px 0 8px; color: var(--fg-bright); font-size: 18px; }
#help-doc p, #help-doc li { line-height: 1.55; }
#help-doc ol { padding-left: 1.2em; }
#help-doc figure { margin: 16px 0; }
#help-doc img, #help-doc video { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #111; }
#help-doc figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#tour { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: rgba(8, 8, 14, .35); }
#tour[hidden] { display: none; }
#tour-card { pointer-events: auto; position: absolute; display: flex; flex-direction: column; gap: 8px; width: min(320px, calc(100% - 24px)); background: #24283b; color: #c0caf5; border: 1px solid var(--accent); border-radius: 10px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
#tour-card h2 { margin: 0; font-size: 16px; color: #c0caf5; }
#tour-text { margin: 0; color: #a9b1d6; font-size: 14px; line-height: 1.45; }
#tour-card .row { display: flex; gap: 8px; }
#tour-card button { border: 1px solid var(--line); background: transparent; color: var(--fg-bright); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
.tour-target { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (max-width: 800px) {
  header { height: auto; flex-wrap: wrap; padding: 6px 8px; }
  .modes { width: 100%; overflow-x: auto; }
  .help-layout { grid-template-columns: 1fr; }
  .help-nav { border-right: 0; border-bottom: 1px solid var(--line); }
  #help-doc { padding: 18px 16px 32px; }
}
</style>
</head>
<body class="__BODY_CLASS__">
<header>
  <div class="brand">keynote</div>
  <nav class="modes">
    <button type="button" data-mode="visual">Visual</button>
    <button type="button" data-mode="overview">Overview</button>
    <button type="button" data-mode="markdown">Markdown</button>
    <button type="button" data-mode="presenter" title="Slide plus speaker notes">Presenter</button>
    <button type="button" data-mode="present" title="Audience view">Present</button>
    <button type="button" data-mode="help" title="Help and user guide (F1)">Help</button>
  </nav>
  <button id="save" type="button">Save</button>
  <span id="status"></span>
</header>
<div id="format">
  <button type="button" data-before="**" data-after="**" title="Bold">Bold</button>
  <button type="button" data-before="*" data-after="*" title="Italic, Hype asterisks">Italic</button>
  <button type="button" data-before="_" data-after="_" title="Underline, Hype underscores">Underline</button>
  <button type="button" data-before="## " data-after="" title="Heading">Heading</button>
  <button type="button" data-before="- " data-after="" title="List">List</button>
  <button type="button" data-before="> " data-after="" title="Quote">Quote</button>
  <button type="button" data-before="`" data-after="`" title="Code">Code</button>
</div>
<div id="workspace">
  <aside id="rail"><h2>Slides</h2><div id="slide-tools"><button type="button" id="dup" title="Duplicate slide (Ctrl+D)">Duplicate</button><button type="button" id="del" title="Delete slide">Delete</button></div><div id="slide-list"></div></aside>
  <div id="divider-side" title="Drag to resize the slide list"></div>
  <div id="main">
    <iframe id="preview" title="Slide"></iframe>
    <div id="h-divider" title="Drag to resize the slide editor"></div>
    <textarea id="slide-source" spellcheck="false" aria-label="Current slide"></textarea>
    <textarea id="source" spellcheck="false" aria-label="Deck markdown"></textarea>
    <div id="v-divider" title="Drag to resize the editor and preview"></div>
    <div id="overview"></div>
  </div>
  <aside id="inspector">
    <h2>Properties</h2>
    <label>Align <select id="align" title="Horizontal alignment"><option value="">Left</option><option value="center">Center</option><option value="right">Right</option><option value="justify">Justify</option></select></label>
    <label>Vertical <select id="valign" title="Vertical alignment"><option value="">Top</option><option value="middle">Middle</option><option value="bottom">Bottom</option></select></label>
    <label>Background <input id="bg" type="text" spellcheck="false" placeholder="#112233, gradient=#111,#333, image=photo.jpg" title="Solid hex, gradient=#a,#b, or image=file.jpg"></label>
    <div class="media-row">
      <button type="button" id="fit" title="Show the whole image">Fit</button>
      <button type="button" id="span" title="Fill the slide">Span</button>
      <button type="button" id="add-image" title="Insert an image">Image</button>
      <button type="button" id="add-video" title="Insert a video">Video</button>
    </div>
    <p class="hint">One image or video per slide. Fit and span are how it sits on the slide. Drop a file onto the window to attach it.</p>
    <h2>Speaker notes</h2>
    <textarea id="notes" spellcheck="true" placeholder="Only you see this. It stays off the slide."></textarea>
  </aside>
</div>
<div id="help">
  <div class="help-layout">
    <nav class="help-nav" aria-label="Help topics">
      <label class="sr" for="help-search">Search help</label>
      <input id="help-search" type="search" placeholder="Search help" autocomplete="off">
      <div id="help-topics"></div>
      <button id="start-tour" type="button">Start guided tour</button>
    </nav>
    <article id="help-doc" tabindex="-1" aria-live="polite"></article>
  </div>
</div>
<div id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tour-title">
  <div id="tour-card">
    <h2 id="tour-title"></h2>
    <div id="tour-text"></div>
    <div class="row">
      <button type="button" id="tour-back">Back</button>
      <button type="button" id="tour-next">Next</button>
      <button type="button" id="tour-skip">Skip</button>
    </div>
  </div>
</div>
<script id="boot" type="application/json">__BOOT_JSON__</script>
<script>
const boot = JSON.parse(document.getElementById('boot').textContent);
const sourceEl = document.getElementById('source');
const slideEl = document.getElementById('slide-source');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const listEl = document.getElementById('slide-list');
const overviewEl = document.getElementById('overview');
let markdown = boot.markdown;
let slides = boot.slides || [];
let fullHtml = boot.html;
let current = 0;
let mode = boot.editor ? 'visual' : 'present';

function explain(e) {
  if (!e) return 'error';
  if (typeof e === 'string') return e;
  if (e.message) return e.message;
  try { return JSON.stringify(e); } catch { return String(e); }
}
async function invoke(cmd, args) {
  if (!window.__TAURI_INTERNALS__) throw new Error('open this window with keynote view');
  return window.__TAURI_INTERNALS__.invoke(cmd, args);
}
function setStatus(text) { status.textContent = text || ''; }

function paint() {
  if (current >= slides.length) current = Math.max(0, slides.length - 1);
  const card = slides[current];
  if (mode === 'markdown' || mode === 'present') preview.srcdoc = fullHtml;
  else if (card) preview.srcdoc = card.html;
  fillInspector(card);
  renderRail();
  renderOverview();
}
function fillInspector(card) {
  const notes = document.getElementById('notes');
  const align = document.getElementById('align');
  const valign = document.getElementById('valign');
  const bg = document.getElementById('bg');
  if (!card || document.activeElement === notes) return;
  notes.value = card.notes || '';
  align.value = card.align || '';
  valign.value = card.valign || '';
  if (document.activeElement !== bg) bg.value = card.background || '';
}
function renderRail() {
  listEl.replaceChildren();
  slides.forEach((slide, index) => {
    const row = document.createElement('div');
    row.className = 'slide-row' + (index === current ? ' current' : '');
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = String(index + 1);
    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.textContent = '⋮⋮';
    const title = document.createElement('span');
    title.textContent = slide.title || ('Slide ' + (index + 1));
    row.append(n, grip, title);
    bindReorder(row, index);
    listEl.append(row);
  });
}
function renderOverview() {
  overviewEl.replaceChildren();
  slides.forEach((slide, index) => {
    const card = document.createElement('article');
    card.className = 'card';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const frame = document.createElement('iframe');
    frame.title = slide.title || ('Slide ' + (index + 1));
    frame.srcdoc = slide.html;
    thumb.append(frame);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = (index + 1) + '  ' + (slide.title || 'Untitled');
    card.append(thumb, label);
    bindReorder(card, index);
    overviewEl.append(card);
  });
  requestAnimationFrame(fitThumbs);
}
function fitThumbs() {
  document.querySelectorAll('.thumb').forEach((thumb) => {
    const frame = thumb.querySelector('iframe');
    if (!frame) return;
    frame.style.transform = 'scale(' + (thumb.clientWidth / 1280) + ')';
  });
}
function bindReorder(el, index) {
  el.dataset.index = String(index);
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const startX = e.clientX;
    const startY = e.clientY;
    let dragging = false;
    let hover = null;
    const move = (ev) => {
      if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
      dragging = true;
      el.classList.add('dragging');
      document.querySelectorAll('.drop-target').forEach((n) => n.classList.remove('drop-target'));
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = under && under.closest('[data-index]');
      hover = target && target !== el ? target : null;
      if (hover) hover.classList.add('drop-target');
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      const to = hover ? Number(hover.dataset.index) : NaN;
      el.classList.remove('dragging');
      document.querySelectorAll('.drop-target').forEach((n) => n.classList.remove('drop-target'));
      hover = null;
      if (!dragging) {
        select(index);
        if (el.classList.contains('card')) setMode('visual');
        return;
      }
      if (Number.isFinite(to) && to !== index) moveSlide(index, to);
    };
    el.setPointerCapture(e.pointerId);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}
function select(index) {
  if (index < 0 || index >= slides.length) return;
  current = index;
  slideEl.value = slides[current].body || '';
  paint();
  invoke('focus_slide', { index: current }).catch(() => {});
}
function setMode(next) {
  mode = next;
  document.body.classList.remove('mode-visual', 'mode-overview', 'mode-markdown', 'mode-present', 'mode-presenter', 'mode-help');
  document.body.classList.add('mode-' + mode);
  document.querySelectorAll('.modes button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  if (mode === 'markdown') sourceEl.value = markdown;
  if (mode === 'visual' && slides[current]) slideEl.value = slides[current].body || '';
  paint();
  if (mode === 'present' || mode === 'presenter') preview.contentWindow && preview.contentWindow.focus();
  if (mode === 'overview') requestAnimationFrame(fitThumbs);
}
function apply(result, keep) {
  markdown = result.markdown;
  fullHtml = result.html;
  slides = result.slides || [];
  if (!keep || keep.source !== true) sourceEl.value = markdown;
  if ((!keep || keep.slide !== true) && slides[current]) slideEl.value = slides[current].body || '';
  if (keep && keep.notes) {
    paint();
    return;
  }
  paint();
}
let timer;
function schedule(fn) {
  setStatus('Editing');
  clearTimeout(timer);
  timer = setTimeout(fn, 180);
}
sourceEl.addEventListener('input', () => schedule(async () => {
  try {
    apply(await invoke('render_deck', { markdown: sourceEl.value }), { source: true });
    setStatus('');
  } catch (e) { setStatus(explain(e)); }
}));
slideEl.addEventListener('input', () => schedule(async () => {
  try {
    apply(await invoke('replace_slide', { markdown, index: current, slide: slideEl.value }), { slide: true });
    setStatus('');
  } catch (e) { setStatus(explain(e)); }
}));
async function moveSlide(from, to) {
  try {
    const result = await invoke('move_slide', { markdown, from, to });
    if (current === from) current = to;
    else if (from < current && to >= current) current -= 1;
    else if (from > current && to <= current) current += 1;
    apply(result);
    setStatus('');
  } catch (e) { setStatus(explain(e)); }
}
function activeEditor() { return mode === 'markdown' ? sourceEl : slideEl; }
document.getElementById('format').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const el = activeEditor();
  const before = btn.dataset.before || '';
  const after = btn.dataset.after || '';
  const start = el.selectionStart;
  const end = el.selectionEnd;
  const sel = el.value.slice(start, end) || 'text';
  el.setRangeText(before + sel + after, start, end, 'end');
  el.focus();
  el.dispatchEvent(new Event('input'));
});
async function save() {
  try {
    await invoke('save_deck', { markdown });
    setStatus('Saved');
  } catch (e) { setStatus(explain(e)); }
}
document.getElementById('save').onclick = save;
document.getElementById('dup').onclick = () => changeDeck(() => invoke('duplicate_slide', { markdown, index: current }));
document.getElementById('del').onclick = () => changeDeck(() => invoke('delete_slide', { markdown, index: current }));
document.getElementById('add-image').onclick = () => changeDeck(() => invoke('insert_media', { markdown, index: current, kind: 'image' }));
document.getElementById('add-video').onclick = () => changeDeck(() => invoke('insert_media', { markdown, index: current, kind: 'video' }));
document.getElementById('fit').onclick = () => patch({ layout: 'fit' });
document.getElementById('span').onclick = () => patch({ layout: 'span' });
document.getElementById('align').onchange = (e) => patch({ align: e.target.value });
document.getElementById('valign').onchange = (e) => patch({ valign: e.target.value });
document.getElementById('bg').onchange = (e) => patch({ background: e.target.value || 'none' });
document.getElementById('notes').addEventListener('input', () => schedule(() => patch({ notes: document.getElementById('notes').value }, true)));
async function changeDeck(op) {
  remember();
  try {
    apply(await op());
    setStatus('');
    scheduleSave();
  } catch (e) {
    if (explain(e) !== 'cancelled') setStatus(explain(e));
  }
}
function patch(fields, fromNotes) {
  const run = async () => {
    if (!fromNotes) remember();
    try {
      apply(await invoke('patch_slide', Object.assign({ markdown, index: current }, fields)), { slide: true, notes: !!fromNotes });
      setStatus('');
      scheduleSave();
    } catch (e) { setStatus(explain(e)); }
  };
  if (fromNotes) run();
  else run();
}
let saveTimer;
function scheduleSave() {
  setStatus('Unsaved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1200);
}
const undoStack = [];
const redoStack = [];
function remember() {
  if (undoStack[undoStack.length - 1] !== markdown) undoStack.push(markdown);
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
}
async function restore(next) {
  try {
    apply(await invoke('render_deck', { markdown: next }));
    setStatus('Unsaved');
    scheduleSave();
  } catch (e) { setStatus(explain(e)); }
}
window.onExternal = (rendered) => { remember(); apply(rendered); scheduleSave(); };
document.querySelectorAll('.modes button').forEach((btn) => {
  btn.onclick = () => setMode(btn.dataset.mode);
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); return; }
  if (e.key === 'F1') { e.preventDefault(); setMode('help'); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
    e.preventDefault();
    const prev = undoStack.pop();
    if (prev === undefined) return;
    redoStack.push(markdown);
    restore(prev);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))) {
    e.preventDefault();
    const next = redoStack.pop();
    if (next === undefined) return;
    undoStack.push(markdown);
    restore(next);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); document.getElementById('dup').click(); return; }
  if (e.target.matches('textarea')) return;
  if (mode === 'visual' || mode === 'overview') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') select(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') select(current - 1);
  }
});
function dragHandle(handle, onMove) {
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    const move = (ev) => onMove(ev);
    const up = () => {
      handle.classList.remove('dragging');
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
}
dragHandle(document.getElementById('divider-side'), (ev) => {
  const rect = document.getElementById('workspace').getBoundingClientRect();
  const width = Math.min(420, Math.max(160, ev.clientX - rect.left));
  document.documentElement.style.setProperty('--side', width + 'px');
});
dragHandle(document.getElementById('v-divider'), (ev) => {
  const rect = document.getElementById('main').getBoundingClientRect();
  let ratio = (ev.clientX - rect.left) / rect.width;
  ratio = Math.min(0.72, Math.max(0.24, ratio));
  document.documentElement.style.setProperty('--split', (ratio * 100) + '%');
});
dragHandle(document.getElementById('h-divider'), (ev) => {
  const rect = document.getElementById('main').getBoundingClientRect();
  const height = Math.min(rect.height * 0.6, Math.max(96, rect.bottom - ev.clientY));
  document.documentElement.style.setProperty('--edit-h', height + 'px');
  fitThumbs();
});
window.addEventListener('resize', fitThumbs);

  { id: 'modes', cat: 'Getting started', title: 'Modes',

  { id: 'reorder', cat: 'Editing', title: 'Reorder and resize',

  { id: 'format', cat: 'Editing', title: 'Text formatting',

  { id: 'keys', cat: 'Shortcuts', title: 'Keyboard',
    html: '<ul><li><kbd>Ctrl</kbd>+<kbd>S</kbd> save</li><li><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo, <kbd>Ctrl</kbd>+<kbd>Y</kbd> redo</li><li><kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate the slide</li><li><kbd>F1</kbd> help</li><li>In Visual or Overview, arrow keys change the selected slide when you are not typing.</li><li>In Present, arrows, Space, and Enter advance. <kbd>n</kbd> toggles notes in an exported HTML file.</li></ul>' }
];
let helpId = 'start';
function renderHelp(filter) {
  const q = (filter || '').trim().toLowerCase();
  const nav = document.getElementById('help-topics');
  nav.replaceChildren();
  let lastCat = '';
  const visible = helpTopics.filter((t) => !q || (t.cat + ' ' + t.title + ' ' + t.html).toLowerCase().includes(q));
  visible.forEach((topic) => {
    if (topic.cat !== lastCat) {
      lastCat = topic.cat;
      const h = document.createElement('div');
      h.className = 'help-cat';
      h.textContent = topic.cat;
      nav.append(h);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = topic.title;
    btn.setAttribute('aria-current', topic.id === helpId ? 'true' : 'false');
    btn.onclick = () => { helpId = topic.id; renderHelp(document.getElementById('help-search').value); };
    nav.append(btn);
  });
  const topic = helpTopics.find((t) => t.id === helpId) || visible[0] || helpTopics[0];
  if (topic && !visible.includes(topic) && visible[0]) helpId = visible[0].id;
  const shown = helpTopics.find((t) => t.id === helpId) || helpTopics[0];
  const doc = document.getElementById('help-doc');
  if (!visible.length) {
    doc.innerHTML = '<h1>No matches</h1><p>Try another word, or clear the search.</p>';
    return;
  }
  doc.innerHTML = '<p class="help-cat">' + shown.cat + '</p><h1>' + shown.title + '</h1>' + shown.html;
}
document.getElementById('help-search').addEventListener('input', (e) => renderHelp(e.target.value));
document.getElementById('start-tour').onclick = () => startTour();
renderHelp('');

const tourSteps = [
  { mode: 'visual', sel: '[data-mode="visual"]', title: 'Visual', text: 'This is where you edit one slide. The preview is the same renderer used for export.' },
  { mode: 'visual', sel: '#rail', title: 'Slide list', text: 'Drag a row onto another row to reorder. Duplicate and Delete sit above the list.' },
  { mode: 'visual', sel: '#format', title: 'Formatting', text: 'Select text, then Bold, Italic, Underline, Heading, List, Quote, or Code.' },
  { mode: 'visual', sel: '#inspector', title: 'Properties', text: 'Align, vertical position, background, and Fit or Span live here. Image and Video insert a local file.' },
  { mode: 'visual', sel: '#notes', title: 'Speaker notes', text: 'Notes stay off the slide. Open Presenter to read them while you talk.' },
  { mode: 'visual', sel: '#save', title: 'Save', text: 'Edits also save themselves. The header says Saved when the file is written.' },
  { mode: 'help', sel: '[data-mode="help"]', title: 'Help', text: 'F1 brings you back here. Search the topics on the left.' }
];
let tourAt = 0;
function placeTour() {
  const step = tourSteps[tourAt];
  setMode(step.mode);
  document.querySelectorAll('.tour-target').forEach((n) => n.classList.remove('tour-target'));
  const el = document.querySelector(step.sel);
  const card = document.getElementById('tour-card');
  document.getElementById('tour-title').textContent = step.title + ' (' + (tourAt + 1) + '/' + tourSteps.length + ')';
  document.getElementById('tour-text').textContent = step.text;
  document.getElementById('tour-back').disabled = tourAt === 0;
  document.getElementById('tour-next').textContent = tourAt === tourSteps.length - 1 ? 'Done' : 'Next';
  if (!el) return;
  el.classList.add('tour-target');
  const r = el.getBoundingClientRect();
  let top = r.bottom + 10;
  if (top + 160 > window.innerHeight) top = Math.max(12, r.top - 160);
  card.style.top = top + 'px';
  card.style.left = Math.min(window.innerWidth - 336, Math.max(12, r.left)) + 'px';
}
function startTour() {
  tourAt = 0;
  document.getElementById('tour').hidden = false;
  placeTour();
  document.getElementById('tour-next').focus();
}
function endTour() {
  document.getElementById('tour').hidden = true;
  document.querySelectorAll('.tour-target').forEach((n) => n.classList.remove('tour-target'));
}
document.getElementById('tour-next').onclick = () => {
  if (tourAt >= tourSteps.length - 1) { endTour(); setMode('help'); return; }
  tourAt += 1;
  placeTour();
};
document.getElementById('tour-back').onclick = () => { if (tourAt > 0) { tourAt -= 1; placeTour(); } };
document.getElementById('tour-skip').onclick = () => { endTour(); setMode('help'); };
document.addEventListener('keydown', (e) => {
  if (document.getElementById('tour').hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); endTour(); }
});

sourceEl.value = markdown;
if (slides[0]) slideEl.value = slides[0].body || '';
setMode(mode);
